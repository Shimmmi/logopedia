services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: logoped
      POSTGRES_USER: logoped
      POSTGRES_PASSWORD: logoped
    volumes:
      - logoped-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logoped -d logoped"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - logoped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - logoped-redis:/data
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - logoped

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://logoped:logoped@postgres:5432/logoped?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /var/www/logoped/storage
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:8030:3000"
    volumes:
      - /var/www/logoped/storage:/var/www/logoped/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - logoped

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://logoped:logoped@postgres:5432/logoped?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /var/www/logoped/storage
    volumes:
      - /var/www/logoped/storage:/var/www/logoped/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logoped

volumes:
  logoped-pg:
  logoped-redis:

networks:
  logoped:
    name: logoped
